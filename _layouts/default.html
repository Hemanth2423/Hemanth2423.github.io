<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'auto'; }
    catch (e) { document.documentElement.dataset.theme = 'auto'; }
  </script>
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main" class="wrap main-content">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</body>
</html>
